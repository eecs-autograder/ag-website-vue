name: Full Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for release'
        required: true

jobs:
  full-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04


    steps:
      # See https://github.com/organizations/eecs-autograder/settings/apps
      # and https://github.com/orgs/community/discussions/25305#discussioncomment-8256560
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ag-website-vue
            autograder-full-stack
          permission-contents: write
          permission-actions: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # fetch all branch and tag history
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Create or checkout release branch
        id: make-branch
        run: |
          branch=$(./dev_scripts/ci/release_branch_from_version.sh "${{ inputs.version }}")
          git checkout -b $branch --track origin/$branch || git checkout -b $branch
          git push -u origin $branch || echo "Remote branch already exists"
          echo "release_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: 'Update submodules'
        run: |
          branch="${{ steps.make-branch.outputs.release_branch }}"
          git config --file=.gitmodules submodule.ag-client-typescript.branch $release_branch
          git config --file=.gitmodules submodule.e2e_test_stack/autograder-server.branch $release_branch

          git submodule update --remote --recursive
          git add -u
          if git commit -m "Update submodules"; then
            git push
          else
            echo "Submodules already updated"
          fi

      - name: Update version number
        run: |
          ./dev_scripts/ci/update_version_number.sh "${{ inputs.version }}"
          git add -u
          if git commit -m "Version ${{ inputs.version }}"; then
            git push
          else
            echo "Version already updated"
          fi

          if git tag ${{ inputs.version }}; then
            git push --tags
          else
            echo "Tag already exists"
          fi

